version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bjj_hybrid_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bjj_user
      POSTGRES_PASSWORD: bjj_secret_password
      POSTGRES_DB: bjj_hybrid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bjj_user -d bjj_hybrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bjj_hybrid_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bjj_user:bjj_secret_password@postgres:5432/bjj_hybrid?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
